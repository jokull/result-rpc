name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-20-package:
    name: Packed package · Node 20.19
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      # Tooling runs on a Node pnpm supports: pnpm 11.9.0 declares
      # engines.node ">=22.13" and aborts on Node 20 with
      # ERR_UNKNOWN_BUILTIN_MODULE. The package under test still gets exercised
      # on 20.19.5 below — only the build of it needs a newer Node.
      - name: Install Node 24 for tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and pack the artifact
        run: |
          pnpm build
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts

      - name: Install Node 20.19.5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.5

      # package.json declares engines.node ">=20.19.5". This is the step that
      # makes that a tested claim rather than an assertion: the packed tarball
      # is installed with npm — which ships with Node 20, unlike pnpm — and
      # every published entry point is imported on the minimum supported Node.
      - name: Load every entry point on the minimum supported Node
        run: |
          node --version
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --loglevel=error \
            react react-dom "$GITHUB_WORKSPACE"/artifacts/*.tgz
          node --input-type=module -e '
            const entries = [
              "result-rpc",
              "result-rpc/server",
              "result-rpc/client",
              "result-rpc/db",
              "result-rpc/query",
              "result-rpc/react",
              "result-rpc/testing",
            ];
            let failed = false;
            for (const entry of entries) {
              try {
                const loaded = await import(entry);
                const count = Object.keys(loaded).length;
                if (count === 0) throw new Error("resolved to an empty module");
                console.log(`ok  ${entry} (${count} exports)`);
              } catch (cause) {
                failed = true;
                console.error(`FAIL ${entry}: ${cause.message}`);
              }
            }
            if (failed) process.exit(1);
          '

  release-gate:
    name: Complete release gate · Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Install demo dependencies
        run: npm ci --prefix demo

      - name: Install documentation dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Prime local package build
        run: pnpm build

      - name: Run complete release verification
        run: pnpm verify:release

      - name: Pack reviewed artifact
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          test "$(find artifacts -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          shasum -a 256 artifacts/*.tgz

      - name: Upload reviewed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-rpc-package-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
