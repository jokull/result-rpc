name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Record OIDC-capable npm
        run: npm --version

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Verify tag and select npm channel
        id: release
        run: node scripts/release-check.mjs

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Install demo dependencies
        run: npm ci --prefix demo

      - name: Install documentation dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Prime local package build
        run: pnpm build

      - name: Run complete release verification
        run: pnpm verify:release

      - name: Pack immutable artifact
        id: pack
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          tarball="release/result-rpc-$VERSION.tgz"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$tarball"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-rpc-v${{ steps.release.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm with provenance
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --tag "$DIST_TAG" --provenance
